<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Register</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>

<div class="page-shell">
  <div class="top-nav home-top-nav">
    <div class="brand">Used Cars</div>
    <div class="nav-links">
      <a href="home.html" class="nav-link">Home</a>
      <a href="login.html" class="nav-link">Login</a>
      <a href="register.html" class="nav-link active">Register</a>
    </div>
  </div>

  <div class="auth-wrap">
    <div class="card">
      <h2 style="text-align:center; margin-bottom:20px;">Seller Register</h2>
      
      <form method="POST" action="register.php" onsubmit="return checkForm()">

      <div class="form-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="fullName" class="input" placeholder="Your full name" required>
        </div>

        <div class="field">
          <label>Address</label>
          <input type="text" name="address" class="input" placeholder="Your address" required>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="text" name="phone" class="input" placeholder="Your phone" id="phone" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" name="email" class="input" placeholder="Your email" required>
        </div>

        <div class="field">
          <label>Username</label>
          <input type="text" name="username" class="input" placeholder="Choose username" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" name="password" class="input" placeholder="Your password" id="pwd" required>
        </div>
      </div>

      <div style="margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
      </div>
      </form>
    </div>
  </div>
</div>

<script>
function checkForm() {
    var phone = document.getElementById('phone').value;
    var pwd = document.getElementById('pwd').value;
    if(phone.length < 11) {
        alert('手机号不对');
        return false;
    }
    if(pwd.length < 6) {
        alert('密码至少6位');
        return false;
    }
    return true;
}
</script>

</body>
</html>
