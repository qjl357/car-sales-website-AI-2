<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>

<main class="page-shell lt-shell">
  <header class="lt-topbar">
    <a class="lt-back" href="home.html" aria-label="Back to home">‹</a>
    <div class="lt-brand-block">
      <p class="lt-brand">Account Management</p>
      <h1>User Access Console</h1>
    </div>
    <nav class="lt-nav">
      <a class="lt-nav-link" href="home.html">Home</a>
      <a class="lt-nav-link" href="publish.php">Publish</a>
      <a class="lt-nav-link active" href="login.html">Login</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h2 style="text-align:center; margin-bottom:20px;">User Login</h2>

      <form id="login-form" action="login.php" method="post" autocomplete="on">
        <div class="form-grid">
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" class="input" required autocomplete="username">
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" class="input" required autocomplete="current-password">
          </div>
        </div>

        <div style="margin-top:20px;">
          <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
        </div>
      </form>

      <p class="hint" style="margin-top:12px;">
        No account yet? <a href="register.html">Go to register</a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
